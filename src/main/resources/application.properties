# Configure the H2 In-Memory Database
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1

# Tell Hibernate to auto-create our database tables based on our @Entity
quarkus.hibernate-orm.database.generation=drop-and-create

# Log SQL statements so we can see JPA working in the background
quarkus.hibernate-orm.log.sql=true

# Enable Second Level Cache globally
quarkus.hibernate-orm.second-level-cache-enabled=true
